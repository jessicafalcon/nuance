[project]
name = "objection-brief"
version = "0.0.0"
description = "Detect objections in a sales-call transcript and draft an honest, grounded brief for the account executive."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Runtime dependencies (PROJECT-BRIEF.md §4) are added by the build step that first
# uses each one, so every lockfile change travels with the code that needs it.
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# The one uv pin: CI's setup-uv reads it. Keep in sync with the uv-lock hook rev in
# .pre-commit-config.yaml.
required-version = "==0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests", "src", ".claude/hooks"]
# The hooks are scripts, not a package; tests import them by module name.
pythonpath = [".claude/hooks"]
# Tests are offline: any socket other than a Unix one fails the test that opens it, so
# an accidental live call to the Anthropic API or Slack fails instead of spending.
addopts = ["--doctest-modules", "--disable-socket", "--allow-unix-socket"]
strict = true

[tool.ruff]
line-length = 100
# The hooks are first-party modules for import sorting in their tests.
src = ["src", ".claude/hooks"]

[tool.ruff.lint]
# S (bandit) catches unsafe YAML loads, string-built SQL, subprocess shells, pickle and
# hardcoded passwords: the public-repo baseline (ob-security).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "DTZ", "S"]

[tool.ruff.lint.pycodestyle]
# The formatter targets 100 but can't split string literals or comments.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", ".claude/hooks"]
strict = ["src"]
extraPaths = [".claude/hooks"]
